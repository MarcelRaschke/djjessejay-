name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '32 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "Dieses Issue ist seit 60 Tagen inaktiv und wird als stale markiert."
          stale-pr-message: "Dieser Pull Request ist seit 60 Tagen inaktiv und wird als stale markiert."
          close-issue-message: "Dieses Issue wurde nach weiterer Inaktivität geschlossen."
          close-pr-message: "Dieser Pull Request wurde nach weiterer Inaktivität geschlossen."
          stale-issue-label: "no-issue-activity"
          stale-pr-label: "no-pr-activity"
