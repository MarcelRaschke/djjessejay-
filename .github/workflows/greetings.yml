name: Welcome contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Danke für dein Issue! Wir schauen uns das an."
          pr-message: "Danke für deinen Pull Request! Die automatischen Checks starten gleich."
